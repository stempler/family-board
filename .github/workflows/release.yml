name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: mise run typecheck
      - run: mise run test
      - run: mise run build
      - run: gh release create "$GITHUB_REF_NAME" dist/family-board-card.js --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
